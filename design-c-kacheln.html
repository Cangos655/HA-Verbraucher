<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design C – Kachel-Raster</title>
<style>
  body { background: #111827; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; font-family: 'Roboto', sans-serif; min-height: 100vh; margin: 0; box-sizing: border-box; }
  .card { background: #1f2937; border-radius: 16px; padding: 20px; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-title { font-size: 16px; font-weight: 600; color: #f3f4f6; }
  .total-badge { background: rgba(99,179,237,.15); border: 1px solid rgba(99,179,237,.3); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: #63b3ed; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: rgba(255,255,255,.05); border-radius: 12px; padding: 14px; border: 1px solid rgba(255,255,255,.06); transition: all .2s; cursor: pointer; }
  .tile.active { background: rgba(99,179,237,.08); border-color: rgba(99,179,237,.25); }
  .tile:hover { background: rgba(255,255,255,.09); }
  .tile.active:hover { background: rgba(99,179,237,.13); }
  .tile-icon { font-size: 24px; margin-bottom: 10px; }
  .tile-name { font-size: 12px; color: rgba(255,255,255,.5); font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
  .tile-power { font-size: 18px; font-weight: 700; color: #f3f4f6; line-height: 1; }
  .tile-power.active { color: #63b3ed; }
  .tile-energy { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.on  { background: #34d399; box-shadow: 0 0 6px #34d399; }
  .dot.off { background: rgba(255,255,255,.2); }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="card-title">Verbraucher</div>
    <div class="total-badge">8.4 kWh heute</div>
  </div>
  <div class="grid">
    <div class="tile active">
      <div class="tile-icon">🫧</div>
      <div class="tile-name"><span class="dot on"></span>Waschmaschine</div>
      <div class="tile-power active">1.850 W</div>
      <div class="tile-energy">2.1 kWh heute</div>
    </div>
    <div class="tile active">
      <div class="tile-icon">🌀</div>
      <div class="tile-name"><span class="dot on"></span>Trockner</div>
      <div class="tile-power active">2.400 W</div>
      <div class="tile-energy">3.8 kWh heute</div>
    </div>
    <div class="tile">
      <div class="tile-icon">📺</div>
      <div class="tile-name"><span class="dot off"></span>Fernseher</div>
      <div class="tile-power">0 W</div>
      <div class="tile-energy">1.6 kWh heute</div>
    </div>
    <div class="tile">
      <div class="tile-icon">❄️</div>
      <div class="tile-name"><span class="dot off"></span>Kühlschrank</div>
      <div class="tile-power">8 W</div>
      <div class="tile-energy">0.9 kWh heute</div>
    </div>
    <div class="tile">
      <div class="tile-icon">💡</div>
      <div class="tile-name"><span class="dot off"></span>Beleuchtung</div>
      <div class="tile-power">24 W</div>
      <div class="tile-energy">0.0 kWh heute</div>
    </div>
  </div>
</div>
</body>
</html>
